keywords: ["British Columbia", "CULV", "MOT", "MOT asset", "MOT inventory", "culvert"]
source_url: "https://catalogue.data.gov.bc.ca/dataset/ministry-of-transportation-mot-culverts"
processing_notes: "Extracted province-wide on 2026-10-07 from the [BC Geographic Warehouse WFS](https://openmaps.gov.bc.ca/geo/pub/wfs) by scripts/extract.sh in [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data): pages of 10,000 features sorted by OBJECTID, row count checked against the server's numberMatched. Geometry is kept in the source CRS, EPSG:3005 (BC Albers); the file is spatially sorted with a bbox covering column. Dropped: GeoServer's synthetic `id`, and LATITUDE/LONGITUDE where the geometry carries them. PMTiles by scripts/tile.sh (tippecanoe, zooms 0-13). BCGW table: MOT_CULVERTS_SP."
known_issues: "Ministry of Transportation highway assets only; municipal culverts are not included."
