keywords: ["British Columbia", "Canada", "groundwater", "gwells", "hydrogeology", "water well", "well"]
source_url: "https://catalogue.data.gov.bc.ca/dataset/groundwater-wells"
processing_notes: "Extracted province-wide on 2026-10-07 from the [BC Geographic Warehouse WFS](https://openmaps.gov.bc.ca/geo/pub/wfs) by scripts/extract.sh in [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data): pages of 10,000 features sorted by OBJECTID, row count checked against the server's numberMatched. Geometry is kept in the source CRS, EPSG:3005 (BC Albers); the file is spatially sorted with a bbox covering column. Dropped: GeoServer's synthetic `id`, and LATITUDE/LONGITUDE where the geometry carries them. PMTiles by scripts/tile.sh (tippecanoe, zooms 0-13). BCGW table: GW_WATER_WELLS_WRBC_SVW."
known_issues: "STREET_ADDRESS and PERSON_RESPONSIBLE can identify private individuals; they are kept as the Province publishes them."
