keywords: ["British Columbia", "BC Parks", "Boundaries", "Canada", "Crown Land", "Crown Land Registry", "Crown Tenure", "Eco Reserves", "Ecological Reserves", "Parks", "Protected Area", "Protected Land", "Provincial Parks", "Tantalis"]
source_url: "https://catalogue.data.gov.bc.ca/dataset/bc-parks-ecological-reserves-and-protected-areas"
processing_notes: "Extracted province-wide on 2026-10-07 from the [BC Geographic Warehouse WFS](https://openmaps.gov.bc.ca/geo/pub/wfs) by scripts/extract.sh in [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data): pages of 10,000 features sorted by OBJECTID, row count checked against the server's numberMatched. Geometry is kept in the source CRS, EPSG:3005 (BC Albers); the file is spatially sorted with a bbox covering column. Dropped: GeoServer's synthetic `id`, and LATITUDE/LONGITUDE where the geometry carries them. PMTiles by scripts/tile.sh (tippecanoe, zooms 0-13). BCGW table: TA_PARK_ECORES_PA_SVW."
known_issues: "The publisher's data dictionary has no column comments for this table, so columns are undescribed."
