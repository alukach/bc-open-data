title: "BC Parks, Ecological Reserves, and Protected Areas"
description: "930 BC Parks, ecological reserves and protected areas. Published by BC Parks (Province of British Columbia) as [BC Parks, Ecological Reserves, and Protected Areas](https://catalogue.data.gov.bc.ca/dataset/bc-parks-ecological-reserves-and-protected-areas) in the BC Data Catalogue; this is a full province-wide mirror. Query recipes and field notes are in [AGENTS.md](AGENTS.md)."

