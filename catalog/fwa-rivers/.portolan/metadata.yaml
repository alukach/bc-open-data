title: "Freshwater Atlas - Rivers"
description: "37,083 double-line river polygons from the Freshwater Atlas: the wide rivers mapped as areas rather than lines. Published by GeoBC Branch (Province of British Columbia) as [Freshwater Atlas - Rivers](https://catalogue.data.gov.bc.ca/dataset/freshwater-atlas-rivers) in the BC Data Catalogue; this is a full province-wide mirror. Query recipes and field notes are in [AGENTS.md](AGENTS.md)."

