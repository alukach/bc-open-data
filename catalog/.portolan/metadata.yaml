title: "British Columbia Open Data"
description: "Province-wide mirrors of openly licensed datasets from the [BC Data Catalogue](https://catalogue.data.gov.bc.ca/), converted from the Province's web services to GeoParquet (query directly with DuckDB over HTTPS) and PMTiles. Independent mirror, not a Province of British Columbia publication; every collection is under the [Open Government Licence \u2013 British Columbia](https://www2.gov.bc.ca/gov/content/data/policy-standards/open-data/open-government-licence-bc). Start with [AGENTS.md](AGENTS.md) for query recipes. Build code and issues: [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data)."

contact:
  name: "Anthony Lukach"
  email: "anthonylukach@gmail.com"

license: "other"
license_url: "https://www2.gov.bc.ca/gov/content/data/policy-standards/open-data/open-government-licence-bc"
attribution: "Contains information licensed under the Open Government Licence \u2013 British Columbia."

keywords: ["British Columbia", "BC", "Canada", "open data", "BC Data Catalogue", "DataBC"]
processing_notes: "Extracted province-wide on 2026-10-07 from the [BC Geographic Warehouse WFS](https://openmaps.gov.bc.ca/geo/pub/wfs) by scripts/extract.sh in [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data): pages of 10,000 features sorted by OBJECTID, row count checked against the server's numberMatched. Geometry is kept in the source CRS, EPSG:3005 (BC Albers); the file is spatially sorted with a bbox covering column. Dropped: GeoServer's synthetic `id`, and LATITUDE/LONGITUDE where the geometry carries them. PMTiles by scripts/tile.sh (tippecanoe, zooms 0-13)."
known_issues: "First release covers 14 datasets. Parcels (ParcelMap BC), the Freshwater Atlas stream network and the Vegetation Resources Inventory are planned (see the GitHub issues). Not refreshed automatically; each collection records its extraction date."
