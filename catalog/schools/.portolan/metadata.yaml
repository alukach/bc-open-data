keywords: ["British Columbia", "Elementary Junior Secondary", "Elementary Secondary", "Franocphone Program", "High schools", "Junior Secondary", "Middle School", "Multi level mixed schools between K 12", "core french", "early French immersion", "elementary", "elementary schools", "francophone", "late French Immersion", "middle and junior high schools", "secondary", "senior secondary", "sites registry"]
source_url: "https://catalogue.data.gov.bc.ca/dataset/bc-schools-k-12-with-francophone-indicators"
processing_notes: "Extracted province-wide on 2026-10-07 from the [BC Geographic Warehouse WFS](https://openmaps.gov.bc.ca/geo/pub/wfs) by scripts/extract.sh in [github.com/alukach/bc-open-data](https://github.com/alukach/bc-open-data): pages of 10,000 features sorted by OBJECTID, row count checked against the server's numberMatched. Geometry is kept in the source CRS, EPSG:3005 (BC Albers); the file is spatially sorted with a bbox covering column. Dropped: GeoServer's synthetic `id`, and LATITUDE/LONGITUDE where the geometry carries them. PMTiles by scripts/tile.sh (tippecanoe, zooms 0-13). BCGW table: GSR_SCHOOLS_K_TO_12_SVW."
known_issues: "CONTACT_* columns hold school switchboards, not personal contacts."
